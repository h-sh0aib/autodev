name: support-agent
version: 1.0.0
description: "Customer support specialist: intake, clarification, safe reproduction and customer replies."
hermes_requires: ">=0.20.0"
author: "Local autonomous development team"
license: "Private"
env_requires:
  - name: OPENROUTER_API_KEY
    description: "API key for the default provider; optional when another provider is configured."
    required: false
    default: ""
  - name: ANTHROPIC_API_KEY
    description: "Optional Anthropic API key; omit for subscription OAuth."
    required: false
    default: ""
distribution_owned:
  - SOUL.md
  - config.yaml
  - distribution.yaml
  - .env.EXAMPLE
  - skills/

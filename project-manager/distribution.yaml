name: project-manager
version: 1.2.0
description: "Reusable autonomous development team project manager, Kanban/GitHub coordinator, and optional messaging gateway owner interface."
hermes_requires: ">=0.12.0"
author: "Local autonomous development team"
license: "Private"
env_requires:
  - name: OPENROUTER_API_KEY
    description: "OpenRouter API key for the default model provider. Optional if you reconfigure the profile to another provider."
    required: false
    default: ""
  - name: TELEGRAM_BOT_TOKEN
    description: "Telegram bot token from BotFather for the PM gateway. Only required if you expose the PM through Telegram."
    required: false
    default: ""
  - name: TELEGRAM_ALLOWED_USERS
    description: "Comma-separated Telegram numeric user IDs allowed to control the PM bot."
    required: false
    default: ""
  - name: GITHUB_TOKEN
    description: "GitHub token for issues, PRs, and CI/project monitoring if GitHub MCP or CLI auth is used."
    required: false
    default: ""
  - name: SIGNAL_HTTP_URL
    description: "Optional Signal REST bridge URL for owner escalation or cron delivery."
    required: false
    default: ""
  - name: SIGNAL_ACCOUNT
    description: "Optional Signal account identifier used by the Signal bridge."
    required: false
    default: ""
distribution_owned:
  - SOUL.md
  - config.yaml
  - distribution.yaml
  - .env.EXAMPLE
  - skills/

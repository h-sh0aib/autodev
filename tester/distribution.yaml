name: tester
version: 1.0.0
description: "Autonomous human-style QA tester using Playwright, PR validation, and production-readiness critique."
hermes_requires: ">=0.12.0"
author: "Local autonomous development team"
license: "Private"
env_requires:
  - name: GITHUB_TOKEN
    description: "GitHub token for reading PRs, filing defects, and commenting validation evidence if GitHub MCP or CLI auth is used."
    required: false
    default: ""


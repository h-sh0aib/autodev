stages:
  - validate

shellcheck:
  stage: validate
  image:
    name: koalaman/shellcheck-alpine:v0.11.0
    entrypoint: [""]
  script:
    - >-
      find . -type f \( -name '*.sh' -o -path './developer/bin/codex-network-exec' \)
      -print0 | xargs -0 shellcheck --severity=warning --external-sources

lifecycle:
  stage: validate
  image: debian:bookworm-slim
  before_script:
    - apt-get update
    - >-
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      bash ca-certificates curl git python3 python3-yaml tar
  script:
    - bash tests/static-checks.sh
    - bash tests/smoke-lifecycle.sh

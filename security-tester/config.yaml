model:
  default: "moonshotai/kimi-k3"
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"
  api_mode: "chat_completions"
toolsets:
  - hermes-cli
  - kanban
terminal:
  backend: local
  timeout: 300
  persistent_shell: true
agent:
  max_turns: 90
  gateway_timeout: 1800
kanban:
  dispatch_in_gateway: true

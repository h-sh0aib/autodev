name: frontend-designer
version: 1.6.0
description: "Reusable autonomous development team frontend designer that uses Lovable MCP sparingly to generate initial UI design guidance for Developer implementation."
hermes_requires: ">=0.20.0"
author: "Local autonomous development team"
license: "Private"
env_requires:
  - name: OPENROUTER_API_KEY
    description: "OpenRouter API key for the default model provider. Optional if you reconfigure the profile to another provider."
    required: false
    default: ""
  - name: ANTHROPIC_API_KEY
    description: "Optional Anthropic API key. Leave blank when the profile uses supported Claude subscription OAuth."
    required: false
    default: ""
distribution_owned:
  - SOUL.md
  - config.yaml
  - distribution.yaml
  - .env.EXAMPLE
  - skills/
